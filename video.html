<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Especial</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav>
    <a href="index.html">Inicio</a>
    <a href="carta.html">Carta</a>
    <a href="recuerdos.html">Recuerdos</a>
    <a href="video.html">Video</a>
    <a href="final.html">Final</a>
</nav>

<section class="card">
    <h1>UN VIDEO ESPECIAL <span class="emoji">🎥</span></h1>
    <p style="text-align:center; margin-bottom:25px;">
        Un video creado con mucho amor ❤️.
    </p>

    <div class="video-box">
        <video controls>
            <source src="videos/videoEspecial.mp4" type="video/mp4">
            Tu navegador no puede reproducir este video.
        </video>
    </div>
</section>



<!-- NUEVA SECCIÓN: JUEGO INTERACTIVO DE ACERTIJOS Y VIDEOS -->
<section class="card" id="seccionJuego">
    <h1>JUEGO DE RECUERDOS <span class="emoji">🧩</span></h1>
    <p style="text-align:center; margin-bottom:20px;">
        Resuelve cada acertijo para desbloquear audios..
    </p>

    <!-- Pantalla de Inicio del Juego -->
    <div id="juegoInicio" style="text-align:center;">
        <button class="btn" id="btnIniciarJuego">¡Comenzar Reto! 💖</button>
    </div>

    <!-- Contenedor del Nivel (Oculto al inicio) -->
    <div id="juegoContenedor" style="display:none;">
        <div style="text-align:center; font-weight:bold; color:var(--morado); margin-bottom:15px;" id="indicadorNivel">
            Nivel 1 de 10
        </div>

        <!-- Zona de Acertijo -->
        <div id="zonaAcertijo" style="background:var(--beige-suave); padding:20px; border-radius:20px; margin-bottom:20px; text-align:center;">
            <p id="textoAcertijo" style="font-size:1.1rem; font-weight:600; margin-bottom:15px;"></p>
            <div id="opcionesAcertijo" style="display:flex; flex-direction:column; gap:10px; max-width:400px; margin:0 auto;"></div>
            <p id="mensajeErrorJuego" style="color:var(--rojo); font-size:0.9rem; margin-top:10px; min-height:20px;"></p>
        </div>

        <!-- Zona de Video Desbloqueado (Oculto hasta acertar) -->
        <div id="zonaVideoJuego" style="display:none; text-align:center;">
            <div class="video-box" style="margin-bottom:15px;">
                <video id="videoNivel" controls>
                    <source src="" type="video/mp4">
                    Tu navegador no soporta videos.
                </video>
            </div>
            <button class="btn" id="btnSiguienteNivel">Siguiente Nivel ➔</button>
        </div>
    </div>
</section>

<!-- VISOR GLOBAL -->
<div class="visor" id="visor">
    <span id="cerrar">&times;</span>
    <div id="contenidoVisor" style="display:flex; justify-content:center; align-items:center; width:100%; height:100%;"></div>
</div>

<footer>
    Hecho con mucho amor por Misael para Lizeth ❤️
</footer>

<script src="js/script.js"></script>

<script src="js/juego.js"></script>
</body>
</html>
