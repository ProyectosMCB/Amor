<script>
/* Galería automática: solo sube fotos a img/ con nombre fotoN (foto31, foto32...) en .jpg, .jpeg, .png o .webp */
(function(){
  const box=document.querySelector(".galeria-collage"), primerVideo=box.querySelector("video");
  const grande=[1, 3, 9, 10, 19, 21, 22, 27], horiz=[5, 12, 17, 18, 20, 23, 24, 25, 26, 28, 29, 30], exts=["jpg","jpeg","png","webp"], MAX=200;
  for(let n=1;n<=MAX;n++){
    const img=document.createElement("img"); let e=0; img.loading="lazy";
    if(grande.includes(n)) img.className="grande"; else if(horiz.includes(n)) img.className="horizontal";
    img.onload=()=>{ if(n>30 && !img.className){ if(img.naturalWidth>img.naturalHeight) img.className="horizontal"; else if(n%3===0) img.className="grande"; } };
    img.onerror=()=>{ e++; if(e<exts.length) img.src="img/foto"+n+"."+exts[e]; else img.remove(); };
    img.src="img/foto"+n+"."+exts[0];
    box.insertBefore(img,primerVideo);
  }
})();
</script>
